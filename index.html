<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Smart Movie Watchlist</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container">
      <!-- Header -->
      <header class="header">
        <h1 id="title">Movie Watchlist</h1>

        <p>Manage your movie watchlist</p>
      </header>

      <!-- Add Task Form -->
      <section class="movie-form">
        <input id="movieInput" type="text" placeholder="Enter a movie..." />

        <button id="addBtn">Add Movie</button>
      </section>

      <!-- Task Statistics -->
      <section class="stats">
        <div class="stat">
          <span>Total</span>

          <strong id="totalCount"> 0 </strong>
        </div>

        <div class="stat">
          <span>Active</span>

          <strong id="activeCount"> 0 </strong>
        </div>

        <div class="stat">
          <span>Completed</span>

          <strong id="completedCount"> 0 </strong>
        </div>
      </section>

      <!-- Task Filters -->
      <section class="filters">
        <button class="filter active" data-filter="all">Watchlist</button>

        <button class="filter" data-filter="active">Active</button>

        <button class="filter" data-filter="completed">Watched</button>
      </section>

      <!-- Todo List -->
      <section class="movies-section">
        <ul id="movieList">
          <!-- Tasks will be created here by JavaScript -->
        </ul>

        <p id="emptyMessage">No movies yet. Add your first movie watchlist!</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
